<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANATOMLE | Replay</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="../js/data/skeletonGraph.js"></script>
    <script src="../js/data/boneMappings.js"></script>
    <script src="../js/data/dailySeeds.js"></script>
    <script src="../js/core/pathfinding.js"></script>
    <script src="../js/core/gameLogic.js"></script>
    <script src="../js/core/seededRandom.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #fdf6ec; color: #2d1f14; overflow: hidden; }

        #cv {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 1;
            background: radial-gradient(ellipse at 50% 40%, #f5e8d0 0%, #ede0c8 60%, #e4d4b8 100%);
        }

        /* ── NAVBAR ── */
        #navbar {
            position: fixed; top: 0; left: 0; right: 0; height: 58px; z-index: 100;
            background: rgba(253,246,236,0.95); backdrop-filter: blur(8px);
            border-bottom: 1.5px solid #e8d5c0;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
        }
        .nav-logo { font-family: 'Fraunces', serif; font-size: 1.4rem; font-weight: 900; color: #2d1f14; text-decoration: none; letter-spacing: -0.03em; }
        .nav-logo span { color: #e8603c; font-style: italic; }
        .nav-btn { background: none; border: 1.5px solid #e8d5c0; border-radius: 8px; padding: 6px 16px; font-family: 'DM Sans', sans-serif; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: #4a3728; cursor: pointer; transition: all 0.15s; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .nav-btn:hover { background: #2d1f14; color: white; border-color: #2d1f14; }

        /* ── REPLAY BADGE ── */
        #replay-badge {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
            z-index: 200; display: flex; align-items: center; gap: 10px;
            background: rgba(253,246,236,0.96); border: 1.5px solid #e8d5c0;
            border-radius: 999px; padding: 8px 20px;
            font-size: 0.78rem; color: #9a8070;
            font-family: 'DM Sans', sans-serif; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.12em;
            box-shadow: 0 4px 16px rgba(45,31,20,0.08);
        }
        #replay-badge .pulse { width: 8px; height: 8px; border-radius: 50%; background: #e8603c; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.8)} }

        /* ── SIDE PANEL ── */
        #panel {
            position: fixed; top: 58px; right: 0; width: 320px; bottom: 0; z-index: 50;
            background: #fff8f0; border-left: 1.5px solid #e8d5c0;
            display: flex; flex-direction: column; padding: 20px 16px; gap: 12px;
            overflow-y: auto;
        }
        .panel-title { font-family: 'Fraunces', serif; font-size: 1rem; font-weight: 700; color: #2d1f14; }
        .panel-sub { font-size: 0.72rem; color: #9a8070; text-transform: uppercase; letter-spacing: 0.12em; }

        .route-pill {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; background: rgba(45,31,20,0.04);
            border-radius: 10px; border: 1.5px solid #e8d5c0;
        }
        .route-start { font-family: 'Fraunces', serif; font-weight: 700; font-size: 0.9rem; color: #5a8a6a; }
        .route-end   { font-family: 'Fraunces', serif; font-weight: 700; font-size: 0.9rem; color: #e8603c; }
        .route-arrow { color: #9a8070; font-size: 0.8rem; }

        .guess-list { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .guess-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-radius: 8px; border: 1.5px solid transparent;
            font-size: 0.85rem; font-weight: 600;
            opacity: 0; transform: translateY(6px);
            transition: all 0.35s ease;
        }
        .guess-item.visible { opacity: 1; transform: translateY(0); }
        .guess-item.optimal { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.25); color: #4f46e5; }
        .guess-item.detour  { background: rgba(240,165,0,0.08);  border-color: rgba(240,165,0,0.25);  color: #b45309; }
        .guess-item.bad     { background: rgba(232,96,60,0.08);  border-color: rgba(232,96,60,0.25);  color: #c94d2b; }
        .guess-item.start   { background: rgba(90,138,106,0.1);  border-color: rgba(90,138,106,0.3);  color: #3d6b4f; }
        .guess-icon { font-size: 1rem; flex-shrink: 0; }

        /* ── END CARD ── */
        #end-card {
            display: none;
            position: fixed; inset: 0; z-index: 600;
            background: rgba(253,246,236,0.85); backdrop-filter: blur(16px);
            align-items: center; justify-content: center;
        }
        #end-card.show { display: flex; }
        .end-inner {
            background: #fff8f0; border: 2px solid #e8d5c0; border-radius: 24px;
            padding: 44px 40px; max-width: 420px; width: 90%; text-align: center;
            box-shadow: 0 32px 64px rgba(45,31,20,0.18);
            animation: slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes slideUp { from { opacity:0; transform: translateY(24px) scale(0.96); } to { opacity:1; transform: none; } }
        .end-emoji { font-size: 3rem; margin-bottom: 10px; }
        .end-title { font-family: 'Fraunces', serif; font-size: 2rem; font-weight: 900; color: #2d1f14; margin-bottom: 6px; letter-spacing: -0.03em; }
        .end-sub { font-size: 0.85rem; color: #9a8070; margin-bottom: 20px; }
        .end-grid { font-size: 1.4rem; letter-spacing: 2px; margin-bottom: 20px; line-height: 1.6; }
        .end-stars { font-size: 1.4rem; margin-bottom: 16px; }
        .end-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-primary {
            padding: 12px 26px; background: linear-gradient(135deg, #e8603c, #c94d2b);
            color: white; border: none; border-radius: 10px;
            font-family: 'Fraunces', serif; font-weight: 900; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
            box-shadow: 0 4px 12px rgba(232,96,60,0.25); text-decoration: none;
            display: block; transition: opacity 0.15s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-secondary {
            padding: 12px 26px; background: rgba(45,31,20,0.05);
            color: #4a3728; border: 1.5px solid #e8d5c0; border-radius: 10px;
            font-family: 'Fraunces', serif; font-weight: 700; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
            text-decoration: none; display: block; transition: all 0.15s;
        }
        .btn-secondary:hover { background: #2d1f14; color: white; border-color: #2d1f14; }

        /* ── PROGRESS BAR ── */
        #progress-bar {
            position: fixed; bottom: 0; left: 0; right: 320px; height: 4px;
            background: #e8d5c0; z-index: 200;
        }
        #progress-fill {
            height: 100%; background: linear-gradient(90deg, #5a8a6a, #e8603c);
            width: 0%; transition: width 0.4s ease;
        }

        #error-screen {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: #fdf6ec; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
        }
        #error-screen.show { display: flex; }
        #error-screen h2 { font-family: 'Fraunces', serif; font-size: 1.6rem; color: #2d1f14; }
        #error-screen p  { font-size: 0.9rem; color: #9a8070; }
    </style>
</head>
<body>

<div id="cv"></div>

<div id="navbar">
    <a href="index.html" class="nav-logo">Anat<span>om</span>le</a>
    <div style="display:flex; align-items:center; gap:8px;">
        <span style="font-size:0.72rem; color:#9a8070; text-transform:uppercase; letter-spacing:0.12em;">Replay</span>
        <a href="games/daily.html" class="nav-btn">▶ Play Today</a>
    </div>
</div>

<div id="replay-badge">
    <div class="pulse"></div>
    <span id="replay-label">Loading replay…</span>
</div>

<div id="panel">
    <div>
        <div class="panel-sub" style="margin-bottom:4px;">Watching replay</div>
        <div class="panel-title" id="panel-date">—</div>
    </div>
    <div class="route-pill">
        <span class="route-start" id="route-start">—</span>
        <span class="route-arrow">→</span>
        <span class="route-end" id="route-end">—</span>
    </div>
    <div class="panel-sub" style="margin-top:4px;">Guesses</div>
    <div class="guess-list" id="guess-list"></div>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>

<!-- End card -->
<div id="end-card">
    <div class="end-inner">
        <div class="end-emoji" id="end-emoji">🏆</div>
        <div class="end-title" id="end-title">Path Found!</div>
        <div class="end-sub" id="end-sub"></div>
        <div class="end-stars" id="end-stars"></div>
        <div class="end-grid" id="end-grid"></div>
        <div class="end-actions">
            <a href="games/daily.html" class="btn-primary">▶ Play Today's Puzzle</a>
            <a href="index.html" class="btn-secondary">← Menu</a>
        </div>
    </div>
</div>

<div id="error-screen">
    <h2>Invalid replay link</h2>
    <p>This link may be expired or malformed.</p>
    <a href="index.html" style="color:#e8603c; font-size:0.9rem;">← Back to home</a>
</div>

<script src="../js/3d/skeletonEngine.js"></script>

<script>
// ── PARSE URL PARAMS ─────────────────────────────────────────────────────────
function getParams() {
    var p = new URLSearchParams(window.location.search);
    var d = p.get('d'); // date string YYYY-MM-DD
    var g = p.get('g'); // comma-separated guess sequence
    if (!d || !g) return null;
    var guesses = decodeURIComponent(g).split(',').filter(Boolean);
    return { date: d, guesses: guesses };
}

function showError() {
    document.getElementById('error-screen').classList.add('show');
    document.getElementById('replay-badge').style.display = 'none';
}

// ── REPLAY ENGINE ─────────────────────────────────────────────────────────────
var params = getParams();
if (!params) {
    showError();
} else {
    var seed = DAILY_SEEDS[params.date];
    if (!seed) { showError(); }
    else {
        var gameData = initializeDailyGame(seed, SKELETON_GRAPH, { minLength: 4, maxLength: 8 });
        var guesses  = params.guesses;

        // Populate panel header
        document.getElementById('panel-date').textContent = new Date(params.date + 'T00:00:00Z')
            .toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });
        document.getElementById('route-start').textContent = gameData.start;
        document.getElementById('route-end').textContent   = gameData.end;
        document.getElementById('replay-label').textContent = 'Replay · ' + params.date;

        // Reconstruct game state step by step
        var chain    = gameData.path.map(function(bone, i) {
            return { bone: bone, type: i === 0 ? 'start' : 'path', guessed: i === 0 };
        });
        var detours  = [];
        var bad      = [];
        var total    = calculateGuessCount(gameData.path.length, 2);
        var left     = total;
        var phase    = 'playing';
        var guessIdx = 0;

        // Add start bone row
        var startItem = document.createElement('div');
        startItem.className = 'guess-item start visible';
        startItem.innerHTML = '<span class="guess-icon">🟢</span><span>' + gameData.start + '</span>';
        document.getElementById('guess-list').appendChild(startItem);

        function updateHighlights() {
            var h = [];
            chain.forEach(function(item, idx) {
                var isLast = idx === chain.length - 1;
                if (item.guessed && !isLast) h.push({ name: item.bone, type: item.type });
                else if (isLast) h.push({ name: item.bone, type: 'end' });
            });
            detours.forEach(function(g) { h.push({ name: g, type: 'detour' }); });
            bad.forEach(function(g)     { h.push({ name: g, type: 'bad' }); });
            try { window.update3D && window.update3D(h); } catch(e) {}
        }

        window.addEventListener('modelReady', updateHighlights);

        function addGuessRow(guess, type) {
            var icons = { optimal:'🟦', detour:'🟡', bad:'🔴' };
            var item = document.createElement('div');
            item.className = 'guess-item ' + type;
            item.innerHTML = '<span class="guess-icon">' + (icons[type]||'⬜') + '</span><span>' + guess + '</span>';
            document.getElementById('guess-list').appendChild(item);
            // Trigger animation next frame
            requestAnimationFrame(function() { item.classList.add('visible'); });
        }

        function updateProgress() {
            var pct = (guessIdx / guesses.length) * 100;
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        function playNextGuess() {
            if (guessIdx >= guesses.length || phase !== 'playing') {
                // Replay done — wait a beat then show end card
                setTimeout(showEndCard, 800);
                return;
            }

            var guess = guesses[guessIdx];
            guessIdx++;
            left--;
            updateProgress();

            // Update replay badge
            document.getElementById('replay-label').textContent =
                'Guess ' + guessIdx + ' of ' + guesses.length + ' · ' + guess;

            if (gameData.path.includes(guess)) {
                // Optimal
                chain = chain.map(function(item) {
                    return item.bone === guess ? { bone: item.bone, type: item.type, guessed: true } : item;
                });
                addGuessRow(guess, 'optimal');
                updateHighlights();
                var guessedOptimal = chain.filter(function(c) { return c.guessed; }).map(function(c) { return c.bone; });
                if (canReachTargetWithGuessed(gameData.start, gameData.end, guessedOptimal, detours, SKELETON_GRAPH)) {
                    phase = 'won';
                }
            } else {
                var result = validateGuess(guess, gameData.path, gameData.start, gameData.end, SKELETON_GRAPH);
                if (result.type === 'detour') {
                    detours.push(guess);
                    addGuessRow(guess, 'detour');
                    updateHighlights();
                    var guessedOptimal2 = chain.filter(function(c) { return c.guessed; }).map(function(c) { return c.bone; });
                    if (canReachTargetWithGuessed(gameData.start, gameData.end, guessedOptimal2, detours, SKELETON_GRAPH)) {
                        phase = 'won';
                    }
                } else {
                    bad.push(guess);
                    addGuessRow(guess, 'bad');
                    updateHighlights();
                    if (left <= 0) phase = 'lost';
                }
            }

            // Schedule next guess
            if (phase === 'playing') {
                setTimeout(playNextGuess, 1200);
            } else {
                setTimeout(showEndCard, 800);
            }
        }

        function buildEmojiGrid() {
            var grid = ['🟢'];
            chain.slice(1, -1).forEach(function(item) {
                grid.push(item.guessed ? '🟦' : '⬜');
            });
            detours.forEach(function() { grid.push('🟡'); });
            bad.forEach(function()     { grid.push('🔴'); });
            grid.push('⬛');
            return grid.join('');
        }

        function showEndCard() {
            var used   = total - left;
            var optimal = gameData.path.length - 1;
            var extra  = used - optimal;
            var stars  = phase === 'won'
                ? (extra === 0 ? '⭐⭐⭐' : extra <= 2 ? '⭐⭐' : '⭐')
                : '';

            document.getElementById('end-emoji').textContent  = phase === 'won' ? (extra === 0 ? '🏆' : '✅') : '💣';
            document.getElementById('end-title').textContent  = phase === 'won' ? (extra === 0 ? 'Perfect Path!' : 'Path Found!') : 'Flatline.';
            document.getElementById('end-sub').textContent    = phase === 'won'
                ? used + ' guess' + (used !== 1 ? 'es' : '') + ' — optimal was ' + optimal
                : bad.length + ' wrong guess' + (bad.length !== 1 ? 'es' : '') + ' · ' + used + ' total';
            document.getElementById('end-stars').textContent  = stars;
            document.getElementById('end-grid').textContent   = buildEmojiGrid();
            document.getElementById('progress-fill').style.width = '100%';
            document.getElementById('replay-badge').style.display = 'none';

            // Add end bone label to guess list
            var endItem = document.createElement('div');
            endItem.className = 'guess-item start visible';
            endItem.innerHTML = '<span class="guess-icon">⬛</span><span>' + gameData.end + '</span>';
            document.getElementById('guess-list').appendChild(endItem);

            document.getElementById('end-card').classList.add('show');
        }

        // Wait for model to load, then start replay with a brief pause
        window.addEventListener('modelReady', function() {
            setTimeout(playNextGuess, 1500);
        });
    }
}
</script>

</body>
</html>
