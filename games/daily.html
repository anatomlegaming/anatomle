<!DOCTYPE html>
<html lang="en">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: #fdf6ec; color: #2d1f14; margin: 0; overflow: hidden; }
        #cv { position: fixed; top: 104px; left: 0; right: 420px; bottom: 68px; z-index: 10;
              background: radial-gradient(ellipse at 50% 40%, #f5e8d0 0%, #ede0c8 60%, #e4d4b8 100%); }
        .scr::-webkit-scrollbar { width: 3px; }
        .scr::-webkit-scrollbar-thumb { background: #e8d5c0; border-radius: 2px; }
        .shake { animation: shake .3s ease-in-out; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
        @keyframes overlayFadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes cardPopIn { from { opacity:0; transform:translateY(28px) scale(0.94); } to { opacity:1; transform:translateY(0) scale(1); } }
        @keyframes streakPop { 0% { opacity:0; transform:scale(0.4) translateY(10px); } 60% { transform:scale(1.2) translateY(-4px); } 80% { transform:scale(0.95); } 100% { opacity:1; transform:scale(1) translateY(0); } }
        @keyframes flameDance { 0%,100% { transform:rotate(-4deg) scale(1); } 50% { transform:rotate(4deg) scale(1.08); } }
        #loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: #fdf6ec;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        #loading-screen .logo { font-family: 'Fraunces', serif; font-size: 2rem; color: #2d1f14; }
        #loading-screen .sub { font-size: 0.85rem; color: #9a8070; letter-spacing: 0.05em; }
        #loading-screen .dot-row { display: flex; gap: 6px; }
        #loading-screen .dot { width: 8px; height: 8px; border-radius: 50%; background: #c8a882; animation: pulse 1.2s infinite; }
        #loading-screen .dot:nth-child(2) { animation-delay: 0.2s; }
        #loading-screen .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }
        #no-puzzle {
            display: none; position: fixed; inset: 0; z-index: 9999;
            background: #fdf6ec; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        }
        #no-puzzle h2 { font-family: 'Fraunces', serif; font-size: 1.5rem; }
        #no-puzzle p { color: #9a8070; font-size: 0.9rem; }
    </style>
</head>
<body>

<!-- Loading screen shown while fetching UTC date -->
<div id="loading-screen">
    <div class="logo">Anatomle</div>
    <div class="sub">Loading today's puzzle…</div>
    <div class="dot-row">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
</div>

<!-- Shown if no seed exists for today's date -->
<div id="no-puzzle">
    <h2>No puzzle today</h2>
    <p>Check back tomorrow — new puzzles added regularly.</p>
    <a href="../index.html" style="color:#c8a882; font-size:0.9rem;">← Back to home</a>
</div>

<div id="cv"></div>
<button onclick="if(window.resetCamera) window.resetCamera();" style="
    position:fixed; bottom:80px; left:16px; z-index:50;
    background:rgba(253,246,236,0.92); border:1.5px solid #e8d5c0;
    border-radius:8px; padding:7px 10px; cursor:pointer;
    font-size:16px; line-height:1; color:#9a8070;
    box-shadow:0 2px 8px rgba(45,31,20,0.1); transition:all 0.15s;
" title="Reset view" onmouseover="this.style.color='#2d1f14'" onmouseout="this.style.color='#9a8070'">⊙</button>
<div id="root"></div>

<script src="../js/3d/skeletonEngine.js"></script>
<script src="../js/ui/pathfindingUI.js"></script>
<script src="../js/ui/howToPlay.js"></script>
<script src="../js/core/boneDescriptions.js"></script>
<script src="../js/ui/boneInfo.js"></script>
<script src="../js/ui/boneTooltip.js"></script>

<script>
// ── FETCH UTC DATE FROM SERVER, FALL BACK TO DEVICE DATE ─────────────────────
// worldtimeapi.org returns real UTC time regardless of system clock.
// If the fetch fails (offline, API down), we fall back to device date.
// This prevents clock-manipulation cheating.

window.DAILY_DATE_STR  = null;   // "YYYY-MM-DD" UTC
window.DAILY_SEED      = null;   // integer seed for today
window.DAILY_GAME_DATA = null;   // { start, end, path }

function getUTCDateString(isoString) {
    // Parse "2026-02-23T..." → "2026-02-23"
    return isoString.slice(0, 10);
}

function initDailyFromDate(dateStr) {
    var seed = getDailySeed(dateStr);
    if (!seed) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('no-puzzle').style.display = 'flex';
        return false;
    }
    window.DAILY_DATE_STR = dateStr;
    window.DAILY_SEED     = seed;
    window.DAILY_GAME_DATA = initializeDailyGame(seed, SKELETON_GRAPH, { minLength: 6, maxLength: 10 });
    return true;
}

function startApp() {
    document.getElementById('loading-screen').style.display = 'none';
    // Trigger React to render — it reads window.DAILY_GAME_DATA
    if (window.__dailyAppReady) window.__dailyAppReady();
}

// Try worldtimeapi first, but never wait on it for more than 2.5 seconds:
// the service is often slow or down, and the device date is a fine fallback.
var __dailyStarted = false;
function startForDate(dateStr) {
    if (__dailyStarted) return;
    __dailyStarted = true;
    if (initDailyFromDate(dateStr)) startApp();
}
function deviceUTCDateString() {
    var now = new Date();
    return now.getUTCFullYear() + '-' +
        String(now.getUTCMonth() + 1).padStart(2, '0') + '-' +
        String(now.getUTCDate()).padStart(2, '0');
}
var __timeFallback = setTimeout(function() { startForDate(deviceUTCDateString()); }, 2500);
fetch('https://worldtimeapi.org/api/timezone/UTC')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var iso = data.utc_datetime || data.datetime;
        if (!iso) throw new Error('no date');
        clearTimeout(__timeFallback);
        startForDate(getUTCDateString(iso));
    })
    .catch(function() {
        clearTimeout(__timeFallback);
        startForDate(deviceUTCDateString());
    });
</script>

<script>
// Daily puzzle: one fixed puzzle per UTC day, progress saved locally,
// streak recorded when the game ends. Rules live in js/core/pathGame.js
function DailyGame() {
    var _r = React.useState(!!window.DAILY_GAME_DATA), ready = _r[0], setReady = _r[1];
    var _s = React.useState(function () {
        var s = window.StreakManager ? window.StreakManager.get() : { count: 0, best: 0 };
        return { count: s.count, best: s.best, isNew: false };
    }), streak = _s[0], setStreak = _s[1];
    var htp = window.useFirstVisit('daily');

    // Called by the date loader above once today's puzzle is known
    window.__dailyAppReady = function () { setReady(true); };

    var dateStr = window.DAILY_DATE_STR;
    var saveKey = 'anatomle_daily_v2_' + dateStr;
    var saved = React.useMemo(function () {
        if (!ready || !dateStr) return null;
        try { var raw = localStorage.getItem(saveKey); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
    }, [ready, dateStr]);

    var game = window.usePathGame({
        graph: SKELETON_GRAPH,
        bonus: 2,
        puzzle: ready && window.DAILY_GAME_DATA
            ? { start: window.DAILY_GAME_DATA.start, end: window.DAILY_GAME_DATA.end } : null,
        saved: saved,
        onChange: function (snap) {
            if (!dateStr) return;
            try {
                localStorage.setItem(saveKey, JSON.stringify({
                    guesses: snap.guesses, phase: snap.phase, reveal: snap.reveal, shared: snap.shared
                }));
            } catch (e) {}
        },
        replayCode: 'fs',
        replayExtra: '&daily=1',
        shareTitle: 'Osteomle \u2013 Daily Puzzle',
        shareDate: dateStr
    });

    // Record the streak once the game ends (StreakManager ignores repeats)
    React.useEffect(function () {
        if (game.phase === 'playing' || !dateStr || !window.StreakManager) return;
        setStreak(window.StreakManager.record(dateStr, game.phase === 'won'));
    }, [game.phase]);

    if (!game.ready) return null;

    var state = Object.assign({}, game.state, { streak: streak });
    var handlers = Object.assign({}, game.handlers, {
        onNewGame: null,
        onHome: function () { window.location.href = '../index.html'; }
    });
    return React.createElement(React.Fragment, null,
        React.createElement(window.HowToModal, { show: htp[0], onClose: htp[1] }),
        React.createElement(window.PathfindingUI, {
            gameTitle: 'Osteomle \u00B7 Daily Puzzle', state: state, handlers: handlers
        }),
        window.BoneTooltipLayer ? React.createElement(window.BoneTooltipLayer) : null
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DailyGame));
</script>
</body>
</html>
