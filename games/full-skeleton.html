<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="icon" href="../favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomle · Full Skeleton</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/notebook.css">
    <script src="../js/ui/theme.js"></script>
    <script src="../js/data/skeletonGraph.js"></script>
    <script src="../js/data/boneMappings.js"></script>
    <script src="../js/core/pathfinding.js"></script>
    <script src="../js/core/gameLogic.js"></script>
    <script src="../js/core/replayIndex.js"></script>
    <script src="../js/core/pathGame.js"></script>
    </head>
<body class="game nb-margin">
<div class="page-turn"></div>
<div id="cv"></div>
<div class="ad-rail" aria-label="Advertisement"></div>
<span class="tape cv-tape-l"></span>
<button type="button" class="nb-btn reset-view" onclick="if(window.resetCamera) window.resetCamera();" title="Reset view" aria-label="Reset view">⊙</button>
<div id="root"></div>

<script src="../js/3d/hlFx.js"></script>
<script src="../js/3d/skeletonEngine.js"></script>
<script src="../js/ui/pathfindingUI.js"></script>
<script src="../js/ui/howToPlay.js"></script>
<script src="../js/core/boneDescriptions.js"></script>
<script src="../js/ui/boneInfo.js"></script>
<script src="../js/ui/boneTooltip.js"></script>

<script>
// Full Skeleton: unlimited random puzzles. All rules live in js/core/pathGame.js
function SkeletonGame() {
    var htp = window.useFirstVisit('full-skeleton');
    var game = window.usePathGame({
        graph: SKELETON_GRAPH,
        bonus: 2,
        newPuzzle: function () { return initializeGame(SKELETON_GRAPH, { minLength: 6, maxLength: 10 }); },
        replayCode: 'fs',
        shareTitle: 'Osteomle \u2013 Full Skeleton'
    });
    return React.createElement(React.Fragment, null,
        React.createElement(window.HowToModal, { show: htp[0], onClose: htp[1] }),
        React.createElement(window.PathfindingUI, {
            gameTitle: 'bones · full skeleton',
            state: game.state,
            handlers: game.handlers
        }),
        window.BoneTooltipLayer ? React.createElement(window.BoneTooltipLayer) : null
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(SkeletonGame));
</script>
</body>
</html>
